<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StepTrack Cloud</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzARlvF9ASv5D6QTDaRFAeHMjEFTl8b9s",
    authDomain: "boom-7fc98.firebaseapp.com",
    databaseURL: "https://boom-7fc98-default-rtdb.firebaseio.com",
    projectId: "boom-7fc98",
    storageBucket: "boom-7fc98.firebasestorage.app",
    messagingSenderId: "911772964594",
    appId: "1:911772964594:web:eb924de2ed46d09239626b",
    measurementId: "G-JK96RW3QZH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.firebaseAPI = { ref, onValue, set, push, remove, update, get, db };
  window.firebaseReady = true;
</script>

<style>
/* ... (стили оставлены прежними для экономии места, они не менялись) ... */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --bg-0: #0a0a0f; --bg-1: #12121c; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08); --text: #f0f0f5; --text-dim: #8a8aa0; --accent-1: #00e5ff; --accent-2: #b500ff; --success: #00ffa3; --danger: #ff3860; --warn: #ffb800; --grad: linear-gradient(135deg, #00e5ff 0%, #b500ff 100%); }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-0); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; overflow-x: hidden; }
.screen { display: none; width: 100%; max-width: 500px; position: relative; z-index: 1; }
.screen.active { display: block; }
.card, .content-card, .header, .sidebar { background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(20px); border-radius: 20px; }
.card { padding: 28px 22px; }
h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
h3::before { content: ''; width: 4px; height: 16px; background: var(--grad); border-radius: 2px; }
.subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 22px; }
input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 15px 16px; background: var(--bg-1); border: 1px solid var(--border); border-radius: 14px; font-size: 16px; color: var(--text); margin-bottom: 12px; outline: none; font-family: inherit; }
button { width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; font-family: inherit; }
.btn-primary { background: var(--grad); color: #000; }
.btn-success { background: linear-gradient(135deg, #00ffa3, #00b87a); color: #001810; }
.btn-danger { background: linear-gradient(135deg, #ff3860, #b5003a); color: #fff; }
.btn-warn { background: linear-gradient(135deg, #ffb800, #d98e00); color: #1a1200; }
.toggle-text { text-align: center; color: var(--text-dim); font-size: 14px; margin-top: 8px; }
.toggle-text a { color: var(--accent-1); cursor: pointer; font-weight: 600; text-decoration: none; }
.error { color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 18px; font-weight: 500; }
.header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.burger { width: 32px; height: 32px; display: flex; flex-direction: column; justify-content: center; gap: 5px; cursor: pointer; padding: 4px; }
.burger span { display: block; height: 2.5px; background: var(--text); border-radius: 2px; }
.user-name { font-weight: 700; color: var(--text); font-size: 14px; }
.content-card { padding: 20px; margin-bottom: 14px; }
.step-count { font-size: 46px; font-weight: 900; text-align: center; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.step-label { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 16px; text-transform: uppercase; }
.file-input-wrapper { position: relative; overflow: hidden; width: 100%; }
.file-input-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
.file-label { display: block; padding: 14px; background: var(--surface-2); border: 1px dashed var(--border-strong); color: var(--text); border-radius: 14px; text-align: center; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
.preview-img { max-width: 100%; border-radius: 14px; margin-top: 10px; display: none; border: 1px solid var(--border); }
.contest-item { padding: 14px; border: 1px solid var(--border); background: var(--bg-1); border-radius: 14px; margin-bottom: 10px; position: relative; }
.contest-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--grad); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 100; }
.overlay.active { display: block; }
.sidebar { position: fixed; top: 0; left: 0; width: 290px; height: 100%; background: var(--bg-1); z-index: 101; transform: translateX(-100%); transition: transform .3s; padding: 24px 20px; overflow-y: auto; border-right: 1px solid var(--border); }
.sidebar.active { transform: translateX(0); }
.sidebar h2 { color: var(--text); margin-bottom: 24px; font-size: 20px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.menu-item { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; cursor: pointer; font-weight: 600; color: var(--text); }
.menu-item:hover { background: var(--surface-2); border-color: var(--accent-1); }
.close-x { position: absolute; top: 20px; right: 20px; font-size: 20px; cursor: pointer; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); width: 34px; height: 34px; border-radius: 50%; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; }
.report-item { padding: 14px; border-radius: 14px; margin-bottom: 10px; background: var(--bg-1); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); }
.report-item.approved { border-left-color: var(--success); }
.report-item.rejected { border-left-color: var(--danger); }
.report-item.pending { border-left-color: var(--warn); }
.report-status { font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
.rating-row { display: flex; align-items: center; padding: 14px; border-bottom: 1px solid var(--border); }
.rating-row:last-child { border-bottom: none; }
.rating-pos { width: 38px; font-weight: 800; color: var(--text-dim); }
.rating-name { flex: 1; font-weight: 600; color: var(--text); }
.rating-steps { font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; }
.admin-report { padding: 14px; border-radius: 14px; background: var(--bg-1); margin-bottom: 12px; border: 1px solid var(--border); }
.admin-report img { max-width: 100%; border-radius: 10px; margin: 10px 0; border: 1px solid var(--border); }
.action-row { display: flex; gap: 8px; }
.action-row button { flex: 1; padding: 11px; font-size: 13px; margin: 0; }
.badge-role { display: inline-block; background: var(--grad); color: #000; font-size: 10px; padding: 3px 8px; border-radius: 8px; margin-left: 8px; font-weight: 800; }
</style>
</head>
<body>

<div class="screen active" id="authScreen">
  <div class="card">
    <h1 id="authTitle">Регистрация</h1>
    <p class="subtitle" id="authSubtitle">Создайте аккаунт для участия</p>
    <div class="error" id="authError"></div>
    <input type="text" id="regName" placeholder="Ваше имя" autocomplete="off">
    <input type="text" id="regBracelet" placeholder="Название браслета / часов" autocomplete="off">
    <input type="password" id="regPassword" placeholder="Пароль" autocomplete="off">
    <button class="btn-primary" onclick="handleAuth()">Зарегистрироваться</button>
    <div class="toggle-text"><span id="togglePrompt">Уже есть аккаунт?</span> <a onclick="toggleAuth()" id="toggleLink">Войти</a></div>
  </div>
</div>

<div class="screen" id="mainScreen">
  <div class="header"><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div><div class="user-name" id="headerName">—</div><div style="width:32px"></div></div>
  <div id="mainContent"></div>
</div>

<div class="screen" id="reportsScreen">
  <div class="header"><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div><div class="user-name">Мои отчёты</div><div style="width:32px"></div></div>
  <div class="content-card"><div id="reportsList"></div></div>
</div>

<div class="screen" id="ratingScreen">
  <div class="header"><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div><div class="user-name">Рейтинг</div><div style="width:32px"></div></div>
  <div class="content-card"><div id="ratingList"></div></div>
</div>

<div class="screen" id="adminScreen">
  <div class="header"><div class="burger" onclick="openMenu()"><span></span><span></span><span></span></div><div class="user-name">Админ <span class="badge-role">ADMIN</span></div><div style="width:32px"></div></div>
  <div class="content-card">
    <h3>Создать конкурс</h3>
    <input type="text" id="contestTitle" placeholder="Название">
    <input type="text" id="contestGoal" placeholder="Цель">
    <input type="text" id="contestPrize" placeholder="Приз">
    <button class="btn-primary" onclick="createContest()">Создать</button>
  </div>
  <div class="content-card"><h3>Отчёты</h3><div id="adminReportsList"></div></div>
  <div class="content-card"><h3>Юзеры</h3><div id="adminUsersList"></div></div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar">
  <button class="close-x" onclick="closeMenu()">✕</button>
  <h2>Меню</h2>
  <div class="menu-item" onclick="nav('main')">🏠 Главная</div>
  <div class="menu-item" onclick="nav('reports')">📋 Мои отчёты</div>
  <div class="menu-item" onclick="nav('rating')">🏆 Рейтинг</div>
  <div class="menu-item" id="adminMenuItem" style="display:none" onclick="nav('admin')">🛠 Админ-панель</div>
  <div class="menu-item" onclick="logout()">🚪 Выйти</div>
</div>

<script>
  let API = null;
  let users = [];
  let contests = [];
  let reports = [];
  let session = null; 
  let isRegisterMode = true;
  let currentScreenshot = null;
  let currentSteps = 0;

  const checkFirebase = setInterval(() => {
    if (window.firebaseReady) {
      clearInterval(checkFirebase);
      API = window.firebaseAPI;
      loadDataFromCloud();
    }
  }, 100);

  function loadDataFromCloud() {
    API.onValue(API.ref(API.db, 'users'), (snap) => {
      const data = snap.val() || {};
      users = Object.keys(data).map(k => ({ bracelet: k, ...data[k] }));
      if (session && !session.isAdmin) updateMainIfActive();
      if (session && session.isAdmin && document.getElementById('adminScreen').classList.contains('active')) renderAdmin();
    });

    API.onValue(API.ref(API.db, 'contests'), (snap) => {
      const data = snap.val() || {};
      contests = Object.values(data);
      if (session && !session.isAdmin) updateMainIfActive();
    });

    API.onValue(API.ref(API.db, 'reports'), (snap) => {
      const data = snap.val() || {};
      reports = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      if (session && !session.isAdmin) updateMainIfActive();
      if (session && session.isAdmin && document.getElementById('adminScreen').classList.contains('active')) renderAdmin();
    });

    // ГЛАВНОЕ ИЗМЕНЕНИЕ: берем токен сессии из URL. 
    // Если URL чистый - мы не авторизованы. Это создает независимые сессии для каждой вкладки.
    const urlParams = new URLSearchParams(window.location.search);
    const sessionToken = urlParams.get('session');
    
    if (sessionToken) {
      // Если в URL есть токен, восстанавливаем сессию
      API.get(API.ref(API.db, 'sessions/' + sessionToken)).then((snapshot) => {
        if (snapshot.exists()) {
          session = snapshot.val();
          enterApp();
        }
      });
    }
  }

  function updateMainIfActive() {
    if (document.getElementById('mainScreen').classList.contains('active')) renderMain();
    if (document.getElementById('ratingScreen').classList.contains('active')) renderRating();
    if (document.getElementById('reportsScreen').classList.contains('active')) renderReports();
  }

  function toggleAuth() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
    document.getElementById('authBtn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
    document.getElementById('togglePrompt').textContent = isRegisterMode ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
    document.getElementById('toggleLink').textContent = isRegisterMode ? 'Войти' : 'Зарегистрироваться';
    document.getElementById('regPassword').style.display = isRegisterMode ? 'block' : 'none';
    document.getElementById('authError').textContent = '';
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function handleAuth() {
    const name = document.getElementById('regName').value.trim();
    const bracelet = document.getElementById('regBracelet').value.trim();
    const password = document.getElementById('regPassword').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';

    if (!name || !bracelet) { errEl.textContent = 'Заполните все поля'; return; }

    let userSession = null;

    if (bracelet.toLowerCase() === 'adminqwerty') {
      userSession = { bracelet: 'admin', isAdmin: true, name: 'Администратор' };
    } else if (isRegisterMode) {
      if (users.find(u => u.bracelet.toLowerCase() === bracelet.toLowerCase())) {
        errEl.textContent = 'Этот браслет уже занят'; return;
      }
      if (password.length < 3) { errEl.textContent = 'Пароль минимум 3 символа'; return; }
      
      API.set(API.ref(API.db, 'users/' + bracelet), { name, password, steps: 0 });
      userSession = { bracelet, isAdmin: false, name };
    } else {
      const u = users.find(x => x.bracelet.toLowerCase() === bracelet.toLowerCase() && x.password === password);
      if (!u) { errEl.textContent = 'Неверный браслет или пароль'; return; }
      userSession = { bracelet: u.bracelet, isAdmin: false, name: u.name };
    }

    // Создаем уникальный токен сессии и пишем его в Firebase
    const newSessionToken = Date.now().toString() + Math.random().toString(36).substr(2, 5);
    API.set(API.ref(API.db, 'sessions/' + newSessionToken), userSession).then(() => {
      session = userSession;
      // Сохраняем токен в URL. Теперь эта вкладка привязана к этой сессии!
      window.history.replaceState(null, '', '?session=' + newSessionToken);
      enterApp();
    });
  }

  function enterApp() {
    document.getElementById('headerName').textContent = session.name || session.bracelet;
    document.getElementById('adminMenuItem').style.display = session.isAdmin ? 'block' : 'none';
    nav(session.isAdmin ? 'admin' : 'main');
  }

  function logout() {
    // Удаляем сессию из Firebase и очищаем URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('session');
    if (token) API.remove(API.ref(API.db, 'sessions/' + token));
    
    session = null;
    window.history.replaceState(null, '', window.location.pathname);
    closeMenu();
    showScreen('authScreen');
  }

  function openMenu() { document.getElementById('overlay').classList.add('active'); document.getElementById('sidebar').classList.add('active'); }
  function closeMenu() { document.getElementById('overlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }

  function nav(page) {
    closeMenu();
    if (page === 'main') { renderMain(); showScreen('mainScreen'); }
    else if (page === 'reports') { renderReports(); showScreen('reportsScreen'); }
    else if (page === 'rating') { renderRating(); showScreen('ratingScreen'); }
    else if (page === 'admin' && session?.isAdmin) { renderAdmin(); showScreen('adminScreen'); }
  }

  function renderMain() {
    const user = users.find(u => u.bracelet === session.bracelet);
    const totalSteps = user ? (user.steps || 0) : 0;
    const contestsHtml = contests.length ? contests.map(c => `<div class="contest-item"><h4>${c.title}</h4><div class="meta">Цель: ${c.goal}</div></div>`).join('') : '<div class="empty-state">Нет конкурсов</div>';

    document.getElementById('mainContent').innerHTML = `
      <div class="content-card">
        <h3>Мои шаги</h3>
        <div class="step-count">${totalSteps.toLocaleString('ru-RU')}</div>
        <div class="step-label">всего одобрено</div>
        <input type="number" id="stepsInput" placeholder="Введите шаги">
        <button class="btn-primary" onclick="saveSteps()">📥 Загрузить</button>
        <div class="file-input-wrapper">
          <label class="file-label" for="screenshotInput">🖼 Скриншот</label>
          <input type="file" id="screenshotInput" accept="image/*" onchange="handleScreenshot(event)">
        </div>
        <img id="previewImg" class="preview-img">
        <button class="btn-success" style="margin-top:10px;" onclick="submitReport()">📤 Отправить</button>
      </div>
      <div class="content-card"><h3>Конкурсы</h3>${contestsHtml}</div>
    `;
  }

  function saveSteps() {
    const v = parseInt(document.getElementById('stepsInput').value);
    if (isNaN(v) || v <= 0) { alert('Введите шаги'); return; }
    currentSteps = v;
    alert('Шаги сохранены.');
  }

  function handleScreenshot(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      currentScreenshot = ev.target.result;
      const img = document.getElementById('previewImg');
      img.src = currentScreenshot;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function submitReport() {
    if (!currentSteps || currentSteps <= 0) { alert('Введите шаги'); return; }
    if (!currentScreenshot) { alert('Выберите скриншот'); return; }

    const newReportRef = API.push(API.ref(API.db, 'reports'));
    API.set(newReportRef, { user: session.name, bracelet: session.bracelet, steps: currentSteps, screenshot: currentScreenshot, status: 'pending', createdAt: new Date().toISOString() });

    currentSteps = 0;
    currentScreenshot = null;
    alert('Отчёт отправлен!');
    renderMain();
  }

  function renderReports() {
    const mine = reports.filter(r => r.bracelet === session.bracelet).reverse();
    const el = document.getElementById('reportsList');
    if (!mine.length) { el.innerHTML = '<div class="empty-state">Нет отчётов</div>'; return; }
    el.innerHTML = mine.map(r => `<div class="report-item ${r.status}"><div class="report-status">${r.status}</div><div class="report-steps">${r.steps.toLocaleString('ru-RU')} шагов</div></div>`).join('');
  }

  function renderRating() {
    const arr = users.filter(u => u.steps > 0).sort((a, b) => b.steps - a.steps);
    const el = document.getElementById('ratingList');
    if (!arr.length) { el.innerHTML = '<div class="empty-state">Рейтинг пуст</div>'; return; }
    el.innerHTML = arr.map((u, i) => `<div class="rating-row"><div class="rating-pos">#${i + 1}</div><div class="rating-name">${u.name}</div><div class="rating-steps">${u.steps.toLocaleString('ru-RU')}</div></div>`).join('');
  }

  function renderAdmin() {
    const pending = reports.filter(r => r.status === 'pending');
    document.getElementById('adminReportsList').innerHTML = !pending.length ? '<div class="empty-state">Нет отчётов</div>' : pending.map(r => `
      <div class="admin-report">
        <div style="font-size:13px; margin-bottom:8px;"><strong>${r.user}</strong> (${r.bracelet})</div>
        <div style="color:var(--accent-1); font-weight:700;">${r.steps} шагов</div>
        ${r.screenshot ? `<img src="${r.screenshot}">` : ''}
        <div class="action-row">
          <button class="btn-success" onclick="reviewReport('${r.id}', 'approved')">✓ Да</button>
          <button class="btn-danger" onclick="reviewReport('${r.id}', 'rejected')">✕ Нет</button>
        </div>
      </div>`).join('');

    document.getElementById('adminUsersList').innerHTML = users.map(u => `
      <div class="user-admin-row">
        <div class="user-admin-name">${u.name}<br><small>${u.bracelet}</small></div>
        <div class="user-admin-steps">${(u.steps||0)}</div>
        <button class="btn-danger mini-btn" onclick="deleteUser('${u.bracelet}')">🗑</button>
      </div>`).join('');
  }

  function createContest() {
    const title = document.getElementById('contestTitle').value.trim();
    if (!title) return;
    const newRef = API.push(API.ref(API.db, 'contests'));
    API.set(newRef, { title, createdAt: new Date().toISOString() });
    renderAdmin();
  }

  function reviewReport(id, status) {
    const r = reports.find(x => x.id === id);
    if (!r) return;
    API.update(API.ref(API.db, 'reports/' + id), { status: status });
    if (status === 'approved') {
      const u = users.find(x => x.bracelet === r.bracelet);
      if (u) API.update(API.ref(API.db, 'users/' + u.bracelet), { steps: (u.steps || 0) + r.steps });
    }
    renderAdmin();
  }

  function deleteUser(bracelet) {
    if (!confirm('Удалить?')) return;
    API.remove(API.ref(API.db, 'users/' + bracelet));
    renderAdmin();
  }
</script>
</body>
</html>
